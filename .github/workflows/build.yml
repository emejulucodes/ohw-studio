name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: OHW Studio (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build (release)
        working-directory: app
        run: swift build -c release
  tools:
    name: Python tools (syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile tools/*.py
